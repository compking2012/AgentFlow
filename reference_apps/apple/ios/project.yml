name: TicketIOS
options:
  bundleIdPrefix: local.agentflow.reference
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
targets:
  TicketIOS:
    type: application
    platform: iOS
    sources: [Sources, ../shared]
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.agentflow.reference.ios
  TicketIOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../shared-tests]
    dependencies: [{target: TicketIOS}]
  TicketIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../shared-ui-tests]
    dependencies: [{target: TicketIOS}]
schemes:
  TicketIOS:
    build:
      targets: {TicketIOS: all, TicketIOSUnitTests: [test], TicketIOSUITests: [test]}
    test:
      targets: [TicketIOSUnitTests, TicketIOSUITests]
      environmentVariables:
        AGENTFLOW_API_URL: "$(AGENTFLOW_API_URL)"
